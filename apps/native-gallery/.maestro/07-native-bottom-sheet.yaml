# Open the gorhom and the Software Mansion native bottom sheets, check the shared
# content is visible, and dismiss each. The native sheet needs a native build.
appId: dev.vvedantb.nativegallery
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: link-native-bottom-sheet
- tapOn:
    id: link-native-bottom-sheet
# Gorhom sheet.
- tapOn:
    id: gorhom-sheet-open
- assertVisible:
    id: gorhom-sheet-body
- assertVisible:
    id: gorhom-sheet-row-0
- takeScreenshot: screenshots/native-bottom-sheet-gorhom
- tapOn:
    id: gorhom-sheet-close
- assertNotVisible:
    id: gorhom-sheet-body
# Software Mansion native sheet, with multiple detents.
- tapOn:
    id: native-sheet-open
- assertVisible:
    id: native-sheet-body
- assertVisible:
    id: native-sheet-row-0
- takeScreenshot: screenshots/native-bottom-sheet-swm
- tapOn:
    id: native-sheet-close
- assertNotVisible:
    id: native-sheet-body
