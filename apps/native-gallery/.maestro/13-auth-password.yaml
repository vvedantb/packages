# Auth screens on the mocked Clerk: the show/hide password button, "Forgot password?",
# the reset flow (email, code, new password twice) and sign-up's confirm password.
# The mock takes any email and the code 424242.
appId: dev.vvedantb.nativegallery
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: link-auth
- tapOn:
    id: link-auth

# Show and hide the password.
- tapOn:
    id: sign-in-password
- inputText: "hunter22pw"
- hideKeyboard
- tapOn:
    id: sign-in-password-toggle
- assertVisible:
    text: "hunter22pw"
- tapOn:
    id: sign-in-password-toggle
- assertNotVisible:
    text: "hunter22pw"

# Forgot password: the reset screen.
- tapOn:
    id: sign-in-forgot-password
- assertVisible:
    id: reset-password-submit
- tapOn:
    id: reset-password-submit
- assertVisible:
    text: "Enter your email"
- tapOn:
    id: reset-password-email
- inputText: "a.very.long.email.address.for.a.stress.case@example-domain.co.uk"
- hideKeyboard
- takeScreenshot: screenshots/auth-reset-email
- tapOn:
    id: reset-password-submit

# A wrong code shows the error. Back, send again, then the right code.
- tapOn:
    id: reset-password-email-code-code
- inputText: "111111"
- hideKeyboard
- tapOn:
    id: reset-password-email-code-verify
- assertVisible:
    id: reset-password-email-code-error
- tapOn:
    id: reset-password-email-code-back
- tapOn:
    id: reset-password-submit
- tapOn:
    id: reset-password-email-code-code
- inputText: "424242"
- hideKeyboard
- tapOn:
    id: reset-password-email-code-verify

# New password: a mismatch blocks, a match finishes.
- assertVisible:
    id: reset-password-new-password
- tapOn:
    id: reset-password-new-password
- inputText: "abcdefgh1"
- tapOn:
    id: reset-password-confirm-password
- inputText: "abcdefgh"
- hideKeyboard
- tapOn:
    id: reset-password-new-password-submit
- assertVisible:
    text: "The passwords do not match"
- takeScreenshot: screenshots/auth-reset-mismatch
- tapOn:
    id: reset-password-confirm-password
- inputText: "1"
- hideKeyboard
- tapOn:
    id: reset-password-new-password-submit
- assertVisible:
    text: "code:reset-done"

# Sign-up: the confirm password must match before the form is sent.
- tapOn:
    id: auth-mode-sign-up
- tapOn:
    id: sign-up-email
- inputText: "new.person@example.com"
- tapOn:
    id: sign-up-password
- inputText: "abcdefgh1"
- tapOn:
    id: sign-up-confirm-password
- inputText: "abcdefgh"
- hideKeyboard
- tapOn:
    id: sign-up-submit
- assertVisible:
    id: sign-up-confirm-error
- takeScreenshot: screenshots/auth-sign-up-mismatch
- tapOn:
    id: sign-up-confirm-password
- inputText: "1"
- assertNotVisible:
    id: sign-up-confirm-error
- hideKeyboard
- tapOn:
    id: sign-up-submit
# The mock has no sign-up: reaching its error shows the form was sent.
- assertVisible:
    id: sign-up-error

# Stress: larger text and dark mode.
- pressKey: back
- pressKey: back
- scrollUntilVisible:
    element:
      id: toggle-larger-text
    direction: UP
- tapOn:
    id: toggle-larger-text
- tapOn:
    id: toggle-dark
- scrollUntilVisible:
    element:
      id: link-auth
- tapOn:
    id: link-auth
- tapOn:
    id: auth-mode-reset
- assertVisible:
    id: reset-password-submit
- takeScreenshot: screenshots/auth-reset-dark-large
- tapOn:
    id: auth-mode-sign-up
- assertVisible:
    id: sign-up-confirm-password
- takeScreenshot: screenshots/auth-sign-up-dark-large

# Change password (still dark, larger text): a mismatch, a wrong current
# password, then the right one. The mock takes `correct-horse`.
- tapOn:
    id: auth-mode-change-password
- assertVisible:
    id: change-password-submit
- takeScreenshot: screenshots/auth-change-password-dark-large
- tapOn:
    id: change-password-current
- inputText: "wrong-password"
- tapOn:
    id: change-password-new
- inputText: "abcdefgh1"
- tapOn:
    id: change-password-confirm
- inputText: "abcdefgh"
- hideKeyboard
- tapOn:
    id: change-password-submit
- assertVisible:
    text: "The passwords do not match"
- tapOn:
    id: change-password-confirm
- inputText: "1"
- hideKeyboard
- tapOn:
    id: change-password-submit
- assertVisible:
    id: change-password-error
- assertNotVisible:
    text: "code:password-changed"
- tapOn:
    id: auth-mode-sign-in
- tapOn:
    id: auth-mode-change-password
- tapOn:
    id: change-password-current
- inputText: "correct-horse"
- tapOn:
    id: change-password-new
- inputText: "abcdefgh1"
- tapOn:
    id: change-password-confirm
- inputText: "abcdefgh1"
- hideKeyboard
- tapOn:
    id: change-password-submit
- assertVisible:
    text: "code:password-changed"

# Delete account: the wrong word leaves the button off, the right word deletes.
- tapOn:
    id: auth-mode-delete-account
- assertVisible:
    id: delete-account-submit
- takeScreenshot: screenshots/auth-delete-account-dark-large
- tapOn:
    id: delete-account-confirm
- inputText: "remove"
- hideKeyboard
- tapOn:
    id: delete-account-submit
- assertNotVisible:
    text: "code:account-deleted"
- tapOn:
    id: auth-mode-sign-in
- tapOn:
    id: auth-mode-delete-account
- tapOn:
    id: delete-account-confirm
- inputText: "delete"
- hideKeyboard
- tapOn:
    id: delete-account-submit
- assertVisible:
    text: "code:account-deleted"
