name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The pnpm store, with a fallback key: after a lockfile change the last
      # store is restored and only the changed packages are downloaded.
      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      # A store restored from the fallback key still holds packages the new
      # lockfile dropped: remove them before the store is saved.
      - name: Prune the pnpm store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm store prune
      # Some tests load built output (for example `@vvedantb/config` dist), and
      # the client-graph guard bundles `@vvedantb/ui` against built
      # `@vvedantb/server`. Build once here, then fan out.
      # ubuntu-latest has 4 vCPUs. pnpm -r defaults to one workspace job per
      # CPU, so cap it for the build.
      - name: Build
        env:
          npm_config_workspace_concurrency: 2
        run: pnpm build
      # Typecheck, guards and tests do not depend on one another once the build
      # is in place, so run them together and wait for all three. The job fails
      # if any one fails; every log is printed.
      #
      # CPU budget for 4 vCPUs: typecheck 1 + guards 1 + test 2 (one package at
      # a time, two Vitest workers). Without the caps, each parent would start
      # one job or worker per CPU and the three would thrash. Vitest 3 does not
      # read VITEST_MAX_WORKERS. It reads VITEST_MAX_THREADS and
      # VITEST_MAX_FORKS (the threads and forks pools), so set both and the
      # shared package configs stay unchanged.
      - name: Typecheck, guards and test
        shell: bash
        env:
          npm_config_workspace_concurrency: 1
          VITEST_MAX_THREADS: 2
          VITEST_MAX_FORKS: 2
        run: |
          set +e
          pnpm typecheck    > typecheck.log 2>&1 & tc=$!
          pnpm check:guards > guards.log    2>&1 & gd=$!
          pnpm test         > test.log      2>&1 & ts=$!
          wait $tc; rc_tc=$?
          wait $gd; rc_gd=$?
          wait $ts; rc_ts=$?
          echo "::group::typecheck"; cat typecheck.log; echo "::endgroup::"
          echo "::group::guards";    cat guards.log;    echo "::endgroup::"
          echo "::group::test";      cat test.log;      echo "::endgroup::"
          echo "exit codes: typecheck=$rc_tc guards=$rc_gd test=$rc_ts"
          [ $rc_tc -eq 0 ] && [ $rc_gd -eq 0 ] && [ $rc_ts -eq 0 ]
