name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: boat-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The pnpm store, with a fallback key: after a lockfile change the last
      # store is restored and only the changed packages are downloaded.
      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      # A store restored from the fallback key still holds packages the new
      # lockfile dropped: remove them before the store is saved.
      - name: Prune the pnpm store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm store prune
      # Some tests load built output (for example `@vvedantb/config` dist).
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      # Hermes ES2023 ban, client import graph, native-ui exports and app names.
      # The client graph check bundles `@vvedantb/ui` against built `@vvedantb/server`,
      # so it runs after Build.
      - name: Guards
        run: pnpm check:guards
      # Runs the no-source-text check, then the package tests.
      - name: Test
        run: pnpm test
