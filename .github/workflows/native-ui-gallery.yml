name: native-ui-gallery

# Builds the Expo gallery (apps/native-gallery) as a release APK with the agent test
# clock (EXPO_PUBLIC_NATIVE_UI_AGENT=1), boots one Android emulator and runs
# apps/native-gallery/e2e/run.mjs through the agent driver (scripts/agent.mjs).
# Before that it proves that a default export has no clock code in it. The job is
# named native-ui-gallery-android so it can be a required check.
#
# The paths filter means a PR that touches none of these paths gets no status from
# this workflow. If the check becomes required, a PR outside these paths would wait
# for a status that never arrives: use a ruleset that only requires it when the
# workflow runs, or drop the filter.
on:
  pull_request:
    paths:
      - "packages/native-ui/**"
      - "apps/native-gallery/**"
      - "scripts/agent.mjs"
      - "scripts/build-dist.mjs"
      - "scripts/agent/**"
      - ".github/workflows/native-ui-gallery.yml"

concurrency:
  group: native-ui-gallery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: "34"

jobs:
  native-ui-gallery-android:
    name: native-ui-gallery-android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build native-ui
        run: |
          pnpm --filter @vvedantb/native-ui typecheck
          pnpm --filter @vvedantb/native-ui test
          pnpm --filter @vvedantb/native-ui build

      - name: Typecheck the gallery
        run: pnpm --filter native-gallery typecheck

      - name: Test the agent driver and the test clock
        run: pnpm test:scripts

      - name: Cache the Expo and Metro caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            apps/native-gallery/node_modules/.cache
          key: expo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native-gallery/package.json') }}
          restore-keys: expo-${{ runner.os }}-

      # Two real `expo export` runs, with and without the agent flag. The default
      # bundle must not contain the clock or bridge; the agent bundle must.
      - name: Prove the default bundle has no agent code
        run: pnpm --filter native-gallery test:strip

      # Prebuild writes apps/native-gallery/android, then Gradle builds an x86_64
      # release APK with the JS bundle inside, so the emulator needs no Metro server.
      # The flag puts the clock and the deep-link bridge in this APK only.
      - name: Build the gallery APK (agent build)
        run: pnpm --filter native-gallery build:android:agent

      - name: Check the APK exists
        run: test -f apps/native-gallery/android/app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-google_apis

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run the e2e flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/native-gallery
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            status=0
            node e2e/run.mjs | tee e2e-log.jsonl || status=$?
            adb logcat -d -t 2000 > logcat.txt || true
            exit $status

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-gallery-android
          path: |
            apps/native-gallery/screenshots
            apps/native-gallery/e2e-log.jsonl
            apps/native-gallery/logcat.txt
          if-no-files-found: warn
          retention-days: 14
