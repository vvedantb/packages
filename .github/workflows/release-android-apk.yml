name: Release Android APK (reusable)

# Reusable workflow for the five Expo apps (velth, verve, vmem, vibot,
# v-store). It builds a signed sideload APK with Gradle (no EAS, no
# EXPO_TOKEN) and publishes it with release.json as a GitHub Release tagged
# <tag_prefix><versionName> (mobile-apk-<versionName> by default). V Store
# installs from there and its catalog sync reads the tag, the asset names and
# release.json, so the asset and release.json formats are not inputs. On a
# tag push the caller's tag is the release tag. dry_run builds and signs the
# APK but publishes nothing. The sideload key is not a Google Play key.
# With release_on: feat (the default), a branch push releases only for a
# feature merge (feat: PR title or commit subject) or a message with
# [release]; any other branch push skips cleanly before checkout. A tag
# push and workflow_dispatch always release.
#
# Ported from vmem .github/workflows/release-android.yml. This repo only
# defines the workflow; it never runs a release itself, so the only trigger
# is workflow_call. Each app keeps a thin caller with its own push paths
# filter, workflow_dispatch inputs, permissions (contents: write) and
# concurrency group. See the README, "Android APK release workflow".
#
# The caller's build script must:
#   - read VERSION_NAME, VERSION_CODE, ANDROID_KEYSTORE_PATH,
#     ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
#     from the environment;
#   - write apk, release_json, version_name, version_code and sha256 to
#     $GITHUB_OUTPUT, with the APK named <apk_basename>-<versionName>-android.apk
#     and release.json shaped {"versionName","versionCode","sha256"}.
# The "Check build outputs" step fails the run if any of that is wrong.
on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app name, like vmem. Default for release_title, apk_basename and the keystore file name."
        required: true
        type: string
      release_title:
        description: "Release title before the versionName (\"<release_title> 1.0.1\"). Default: app_name."
        required: false
        type: string
        default: ""
      apk_basename:
        description: "APK asset name before -<versionName>-android.apk. Default: app_name. Must match the name the build script writes and the name V Store expects."
        required: false
        type: string
        default: ""
      app_dir:
        description: "Expo app folder, relative to the repo root."
        required: false
        type: string
        default: apps/mobile
      package_id:
        description: "Android applicationId, like com.projectvdotuk.vmem. If set, the workflow checks the built APK's package, versionCode and versionName with aapt2 (the vmem build script also checks them). Empty skips that check."
        required: false
        type: string
        default: ""
      app_config_path:
        description: "File with the DEFAULT_VERSION_NAME literal (the versionName floor) when version_name_source is default_version_name. Default: <app_dir>/app.config.ts."
        required: false
        type: string
        default: ""
      version_name_source:
        description: "Where the versionName floor comes from. default_version_name: the DEFAULT_VERSION_NAME literal in app_config_path. app_json: expo.version in app_json_path (v-store's rules)."
        required: false
        type: string
        default: default_version_name
      app_json_path:
        description: "app.json with expo.version, relative to the repo root. Used only when version_name_source is app_json."
        required: false
        type: string
        default: app.json
      tag_prefix:
        description: "Release tag prefix. Tags are <tag_prefix><versionName>. V Store's catalog sync reads mobile-apk-* tags."
        required: false
        type: string
        default: mobile-apk-
      build_script:
        description: "Build script, relative to the repo root. Run with bash from the repo root."
        required: false
        type: string
        default: scripts/build-android-release.sh
      release_notes_path:
        description: "Release notes template with {{versionName}}, {{versionCode}} and {{sha256}}. Empty publishes the generated What's changed notes only."
        required: false
        type: string
        default: .github/android-release-notes.md
      keystore_filename:
        description: "File name (no folders) for the decoded keystore in RUNNER_TEMP. Default: <app_name>-release.p12."
        required: false
        type: string
        default: ""
      node_version:
        description: "Node.js version for actions/setup-node."
        required: false
        type: string
        default: "22"
      java_version:
        description: "Temurin JDK version for actions/setup-java."
        required: false
        type: string
        default: "21"
      sdk_packages:
        description: "sdkmanager packages to install, separated by spaces or new lines."
        required: false
        type: string
        default: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
      version_code_floor:
        description: "Lowest versionCode a release can get."
        required: false
        type: number
        default: 1000
      version_code:
        description: "versionCode, a whole number. Must be at least the highest published versionCode + 1 and version_code_floor. Empty uses that minimum."
        required: false
        type: string
        default: ""
      mark_as_latest:
        description: "Mark the release as the repo's latest release. False keeps the flag on other products' releases in the same repo."
        required: false
        type: boolean
        default: false
      version:
        description: "versionName, like 1.0.1. On a tag push it must match the tag. Empty takes the tag's version on a tag push, else bumps the patch of the highest published release.json versionName (see version_name_source for the floor)."
        required: false
        type: string
        default: ""
      release_on:
        description: "Which push events release. feat (default): only a branch push whose PR title (for a 'Merge pull request' commit) or commit subject starts with feat:, feat(scope):, feat!: or feat(scope)!: (any case), or whose commit message contains [release]. always: every push, as before. A tag push (refs/tags/...) and workflow_dispatch always release."
        required: false
        type: string
        default: feat
      dry_run:
        description: "Build and sign the APK, but skip gh release create and post-publish (no tag, no release)."
        required: false
        type: boolean
        default: false
      upload_dry_run_artifact:
        description: "On dry_run, upload the APK and release.json as the Actions artifact <app_name>-android-dry-run."
        required: false
        type: boolean
        default: false
      build_env:
        description: "Extra environment for the pre-build, build and post-publish steps. One NAME=value per line; # starts a comment line. Not masked, so no secrets here (use the BUILD_ENV_SECRETS secret)."
        required: false
        type: string
        default: ""
      pre_setup_command:
        description: "Optional inline bash run from the repo root after the input checks and before the Node, pnpm and Java setup, like freeing runner disk space. Empty skips it."
        required: false
        type: string
        default: ""
      pre_build_script:
        description: "Optional script run with bash from the repo root after the toolchain is set up and before the build script, like a patch to a config plugin. Empty skips it."
        required: false
        type: string
        default: ""
      pre_build_command:
        description: "Optional inline bash run from the repo root after pre_build_script and before the build script. Empty skips it."
        required: false
        type: string
        default: ""
      post_publish_script:
        description: "Optional script run with bash from the repo root after the release is published. Skipped on dry_run. Empty skips it."
        required: false
        type: string
        default: ""
      post_publish_command:
        description: "Optional inline bash run from the repo root after post_publish_script. Skipped on dry_run. Empty skips it."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner label. It needs the Android SDK at ANDROID_HOME, as GitHub's Ubuntu images have."
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: "Job timeout in minutes."
        required: false
        type: number
        default: 90
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: "Base64 of the PKCS12 sideload keystore."
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Keystore password."
        required: false
      ANDROID_KEY_ALIAS:
        description: "Key alias in the keystore."
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Key password."
        required: false
      BUILD_ENV_SECRETS:
        description: "Optional secret environment for the pre-build, build and post-publish steps, in the build_env format. Values are masked in logs."
        required: false
    outputs:
      tag:
        description: "Release tag, <tag_prefix><versionName>, or the pushed tag on a tag push."
        value: ${{ jobs.release.outputs.tag }}
      version_name:
        description: "versionName of the built APK."
        value: ${{ jobs.release.outputs.version_name }}
      version_code:
        description: "versionCode of the built APK."
        value: ${{ jobs.release.outputs.version_code }}
      sha256:
        description: "SHA-256 of the APK."
        value: ${{ jobs.release.outputs.sha256 }}
      published:
        description: "true when a release was created, false on dry_run, empty when the push was skipped (release_on: feat)."
        value: ${{ jobs.release.outputs.published }}
      release_url:
        description: "URL of the published release. Empty on dry_run."
        value: ${{ jobs.release.outputs.release_url }}

jobs:
  release:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # A called workflow can only keep or lower the caller's permissions, so
    # the caller must grant contents: write too.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
      sha256: ${{ steps.check.outputs.sha256 }}
      published: ${{ steps.publish.outputs.published }}
      release_url: ${{ steps.publish.outputs.release_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      APP_NAME: ${{ inputs.app_name }}
      APP_DIR: ${{ inputs.app_dir }}
      KEYSTORE_FILENAME: ${{ inputs.keystore_filename != '' && inputs.keystore_filename || format('{0}-release.p12', inputs.app_name) }}
    defaults:
      run:
        # -eo pipefail, unlike the default shell.
        shell: bash
    steps:
      # First, before checkout and anything slow: on a branch push with
      # release_on: feat, release only for a feature merge. A tag push
      # always releases, because the tag is the release. The github
      # context is the caller's, so head_commit is the pushed commit. Every
      # later step runs only when should_release is true.
      - name: Decide whether to release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_ON: ${{ inputs.release_on }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$RELEASE_ON" in
            feat|always) ;;
            *)
              echo "::error::release_on '$RELEASE_ON' must be feat or always."
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" != push ] || [ "$RELEASE_ON" = always ]; then
            echo "Event $EVENT_NAME, release_on $RELEASE_ON: releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF" == refs/tags/* ]]; then
            echo "Tag push $REF: releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merge commit is "Merge pull request #N from <branch>", a blank
          # line, then the PR title, so decide on the first non-empty line
          # after the first. Any other commit is decided on its subject.
          message="${COMMIT_MESSAGE//$'\r'/}"
          subject="$(head -n 1 <<<"$message")"
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\  ]]; then
            subject="$(tail -n +2 <<<"$message" | grep -m 1 -v '^[[:space:]]*$' || true)"
          fi
          echo "Deciding on: ${subject:-<empty>}"

          # Conventional feat:, feat(scope):, feat!: or feat(scope)!:, any case.
          feat_rule='^[[:space:]]*feat(\([^)]+\))?!?:([[:space:]]|$)'
          shopt -s nocasematch
          is_feat=""
          [[ "$subject" =~ $feat_rule ]] && is_feat=1
          shopt -u nocasematch

          # [release] anywhere in the message forces a release (exact case).
          if [ -n "$is_feat" ]; then
            echo "Feature merge, releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$message" == *"[release]"* ]]; then
            echo "Commit message contains [release], releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a feature merge, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.should_release == 'true'

      # Inputs are checked before anything slow runs. Paths in inputs are
      # read through env, never pasted into a script.
      - name: Check inputs
        if: steps.gate.outputs.should_release == 'true'
        env:
          APP_CONFIG_PATH: ${{ inputs.app_config_path }}
          VERSION_NAME_SOURCE: ${{ inputs.version_name_source }}
          APP_JSON_PATH: ${{ inputs.app_json_path }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
          PRE_BUILD_SCRIPT: ${{ inputs.pre_build_script }}
          POST_PUBLISH_SCRIPT: ${{ inputs.post_publish_script }}
          APK_BASENAME: ${{ inputs.apk_basename }}
          BUILD_ENV: ${{ inputs.build_env }}
          BUILD_ENV_SECRETS: ${{ secrets.BUILD_ENV_SECRETS }}
        run: |
          failed=""
          fail() {
            echo "::error::$1"
            failed=1
          }

          name_rule='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          [[ "$APP_NAME" =~ $name_rule ]] || fail "app_name '$APP_NAME' must be letters, digits, '.', '_' or '-'."
          [[ "${APK_BASENAME:-$APP_NAME}" =~ $name_rule ]] || fail "apk_basename '$APK_BASENAME' must be letters, digits, '.', '_' or '-'."
          [[ "$KEYSTORE_FILENAME" =~ $name_rule ]] || fail "keystore_filename '$KEYSTORE_FILENAME' must be a file name with no folders."
          # tag_prefix goes into a gh --jq filter, so only these characters.
          [[ "$TAG_PREFIX" =~ $name_rule ]] || fail "tag_prefix '$TAG_PREFIX' must be letters, digits, '.', '_' or '-'."

          [ -d "$APP_DIR" ] || fail "app_dir '$APP_DIR' is not a folder in this repo."
          case "$VERSION_NAME_SOURCE" in
            default_version_name)
              app_config="${APP_CONFIG_PATH:-$APP_DIR/app.config.ts}"
              [ -f "$app_config" ] || fail "app_config_path '$app_config' does not exist."
              ;;
            app_json)
              [ -f "$APP_JSON_PATH" ] || fail "app_json_path '$APP_JSON_PATH' does not exist."
              ;;
            *)
              fail "version_name_source '$VERSION_NAME_SOURCE' must be default_version_name or app_json."
              ;;
          esac
          [ -f "$BUILD_SCRIPT" ] || fail "build_script '$BUILD_SCRIPT' does not exist."
          if [ -n "$RELEASE_NOTES_PATH" ] && [ ! -f "$RELEASE_NOTES_PATH" ]; then
            fail "release_notes_path '$RELEASE_NOTES_PATH' does not exist. Set it to an empty string to publish without a template."
          fi
          if [ -n "$PRE_BUILD_SCRIPT" ] && [ ! -f "$PRE_BUILD_SCRIPT" ]; then
            fail "pre_build_script '$PRE_BUILD_SCRIPT' does not exist."
          fi
          if [ -n "$POST_PUBLISH_SCRIPT" ] && [ ! -f "$POST_PUBLISH_SCRIPT" ]; then
            fail "post_publish_script '$POST_PUBLISH_SCRIPT' does not exist."
          fi

          # build_env and BUILD_ENV_SECRETS: NAME=value lines. Names the
          # workflow sets itself are refused, so extra env cannot change the
          # version, the signing key or the runner.
          reserved='^(VERSION_NAME|VERSION_CODE|ANDROID_KEYSTORE_[A-Z0-9_]*|ANDROID_KEY_[A-Z0-9_]*|ANDROID_HOME|ANDROID_SDK_ROOT|GITHUB_[A-Z0-9_]*|RUNNER_[A-Z0-9_]*|ACTIONS_[A-Z0-9_]*|PATH)$'
          check_env() {
            local source="$1" masked="$2" line name
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              if [ -z "${line//[[:space:]]/}" ] || [[ "$line" =~ ^[[:space:]]*# ]]; then
                continue
              fi
              name="${line%%=*}"
              if [ "$name" = "$line" ] || ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                fail "$source has a line that is not NAME=value (name '${name:0:40}')."
              elif [[ "$name" =~ $reserved ]]; then
                fail "$source sets $name, which this workflow sets or protects."
              elif [ "$masked" = 1 ] && [ -n "${line#*=}" ]; then
                echo "::add-mask::${line#*=}"
              fi
            done <<<"$3"
          }
          check_env build_env 0 "$BUILD_ENV"
          check_env BUILD_ENV_SECRETS 1 "$BUILD_ENV_SECRETS"

          [ -z "$failed" ] || exit 1

      # Before the toolchain, so it can free disk space for the setup steps.
      - name: Pre-setup
        if: steps.gate.outputs.should_release == 'true' && (inputs.pre_setup_command != '')
        env:
          PRE_SETUP_COMMAND: ${{ inputs.pre_setup_command }}
        run: |
          echo "Running pre_setup_command"
          bash -eo pipefail -c "$PRE_SETUP_COMMAND"

      - name: Choose versionName, versionCode and tag
        if: steps.gate.outputs.should_release == 'true'
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          APP_CONFIG_PATH: ${{ inputs.app_config_path }}
          VERSION_NAME_SOURCE: ${{ inputs.version_name_source }}
          APP_JSON_PATH: ${{ inputs.app_json_path }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          VERSION_CODE_FLOOR: ${{ inputs.version_code_floor }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          # True if X.Y.Z $1 is higher than $2.
          version_gt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]
          }

          if ! [[ "$VERSION_CODE_FLOOR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::version_code_floor must be a whole number from 1."
            exit 1
          fi

          # On a tag push the tag names the version: <tag_prefix><versionName>.
          tag_version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG_PREFIX"* ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not start with $TAG_PREFIX, so V Store's catalog sync would never pick it up."
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
            if ! [[ "$tag_version" =~ $semver ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must be $TAG_PREFIX followed by a versionName like 1.0.1."
              exit 1
            fi
          fi

          # default_version_name: DEFAULT_VERSION_NAME in app.config.ts is the
          # versionName floor. vmem writes `const DEFAULT_VERSION_NAME = "1.0.0";`;
          # an `export` in front is also read. app_json reads expo.version
          # further down, as v-store did.
          app_version=""
          if [ "$VERSION_NAME_SOURCE" = default_version_name ]; then
            app_config="${APP_CONFIG_PATH:-$APP_DIR/app.config.ts}"
            app_version="$(sed -n -E 's/^(export )?const DEFAULT_VERSION_NAME = "([^"]*)";$/\2/p' "$app_config")"
            if ! [[ "$app_version" =~ $semver ]]; then
              echo "::error::Could not read the DEFAULT_VERSION_NAME literal from $app_config."
              exit 1
            fi
          fi

          # Highest versionName and versionCode in published <tag_prefix>*
          # release.json files. A release without release.json (before this
          # workflow) counts as versionCode 1. Any other gh error stops the
          # run rather than undercounting.
          # releases has a "versionName tag" line for each release.json, so
          # the release notes can start from the highest published version.
          # name_tags maps each semver versionName to its tag, and
          # highest_name is the highest one (no floor), for app_json.
          names="$app_version"
          releases=""
          highest_code=0
          highest_name=""
          declare -A name_tags=()
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq ".[].tagName | select(startswith(\"$TAG_PREFIX\"))")"
          for tag in $tags; do
            manifest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | select(.name == "release.json") | .name')"
            if [ -z "$manifest" ]; then
              code=1
            else
              release_json="$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release.json --output -)"
              code="$(jq -r '.versionCode // empty' <<<"$release_json")"
              name="$(jq -r '.versionName // empty' <<<"$release_json")"
              if ! [[ "$code" =~ ^[0-9]+$ ]]; then
                echo "::error::$tag release.json has no valid versionCode."
                exit 1
              fi
              # A legacy release with a non-semver versionName still counts
              # for versionCode, but not for versionName or release notes.
              if [[ "$name" =~ $semver ]]; then
                names="$names"$'\n'"$name"
                releases="$releases"$'\n'"$name $tag"
                name_tags["$name"]="$tag"
                if [ -z "$highest_name" ] || version_gt "$name" "$highest_name"; then
                  highest_name="$name"
                fi
              else
                echo "::warning::$tag release.json versionName '$name' is not like 1.0.1. Ignored for versionName."
              fi
            fi
            if [ "$code" -gt "$highest_code" ]; then
              highest_code="$code"
            fi
          done

          if [ "$VERSION_NAME_SOURCE" = app_json ]; then
            # v-store's rules: the version input; else the tag's version;
            # else the highest published versionName with the patch bumped,
            # or expo.version if that is higher (a minor or major bump
            # committed there) or nothing is published yet.
            if [ -n "$INPUT_VERSION" ]; then
              version_name="$INPUT_VERSION"
            elif [ -n "$tag_version" ]; then
              version_name="$tag_version"
            else
              version_name="$(jq -r '.expo.version // empty' "$APP_JSON_PATH")"
              if [ -n "$highest_name" ]; then
                IFS=. read -r major minor patch <<<"$highest_name"
                bumped="$major.$minor.$((patch + 1))"
                if ! [[ "$version_name" =~ $semver ]] || version_gt "$bumped" "$version_name"; then
                  version_name="$bumped"
                fi
              fi
            fi
            if ! [[ "$version_name" =~ $semver ]]; then
              echo "::error::versionName must be X.Y.Z, for example 1.0.1. Check the version input, or expo.version in $APP_JSON_PATH."
              exit 1
            fi
          elif [ -n "$INPUT_VERSION" ]; then
            version_name="$INPUT_VERSION"
            if ! [[ "$version_name" =~ $semver ]]; then
              echo "::error::version must look like 1.0.1."
              exit 1
            fi
          elif [ -n "$tag_version" ]; then
            version_name="$tag_version"
          else
            highest_name="$(sort -V <<<"$names" | tail -n 1)"
            IFS=. read -r major minor patch <<<"$highest_name"
            version_name="$major.$minor.$((patch + 1))"
          fi

          if [ -n "$tag_version" ] && [ "$version_name" != "$tag_version" ]; then
            echo "::error::The version input ($version_name) does not match the tag $GITHUB_REF_NAME."
            exit 1
          fi
          if [ "$VERSION_NAME_SOURCE" = app_json ]; then
            if [ -n "${name_tags[$version_name]:-}" ]; then
              echo "::error::versionName $version_name is already published in ${name_tags[$version_name]}."
              exit 1
            fi
            if [ -n "$highest_name" ] && ! version_gt "$version_name" "$highest_name"; then
              echo "::error::versionName $version_name must be higher than $highest_name, the highest published release.json."
              exit 1
            fi
          fi

          # Sideload versionCodes start at version_code_floor (1000), apart
          # from local builds (DEFAULT_VERSION_CODE in app.config.ts). The
          # version_code input can only raise that minimum.
          min_code=$((highest_code + 1))
          if [ "$min_code" -lt "$VERSION_CODE_FLOOR" ]; then
            min_code="$VERSION_CODE_FLOOR"
          fi
          version_code="${INPUT_VERSION_CODE:-$min_code}"
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || [ "$version_code" -lt "$min_code" ]; then
            echo "::error::version_code '$version_code' must be a whole number of at least $min_code (above $highest_code, the highest published release.json, and at least version_code_floor $VERSION_CODE_FLOOR)."
            exit 1
          fi

          # A tag push releases that tag, which already exists. Otherwise the
          # workflow creates <tag_prefix><versionName>, which must not exist:
          # gh release create would reuse it and ignore --target.
          if [ -n "$tag_version" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$TAG_PREFIX$version_name"
          fi
          if [[ "$tag" != "$TAG_PREFIX"* ]]; then
            echo "::error::$tag does not start with $TAG_PREFIX, so V Store's catalog sync would never pick it up."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          if [ -z "$tag_version" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release. Delete it or choose another version."
            exit 1
          fi

          # The release with the highest semver versionName. GitHub's "latest
          # release" can be another product's release in the same repo.
          # app_json takes the tag that carries highest_name, as v-store did.
          if [ "$VERSION_NAME_SOURCE" = app_json ]; then
            previous_tag=""
            if [ -n "$highest_name" ]; then
              previous_tag="${name_tags[$highest_name]}"
            fi
          else
            previous_tag="$(sort -V <<<"$releases" | tail -n 1 | cut -s -d ' ' -f 2)"
          fi

          echo "Releasing $tag: versionName $version_name, versionCode $version_code (highest release: $highest_code, floor: $VERSION_CODE_FLOOR). Previous release: ${previous_tag:-none}"
          {
            echo "previous_tag=$previous_tag"
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        if: steps.gate.outputs.should_release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Pass them with secrets: inherit or by name. Release builds never fall back to the debug key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/$KEYSTORE_FILENAME"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Version from packageManager in the caller's root package.json.
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.should_release == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.should_release == 'true'
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.should_release == 'true'
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      # The runner image has the Android SDK at $ANDROID_HOME with current
      # cmdline-tools. android-actions/setup-android@v3 swaps in older ones and
      # installs the removed "tools" package, so it is not used. The default
      # sdk_packages are what React Native 0.86 pins, and AGP's default CMake,
      # installed before Gradle needs them.
      - name: Install Android SDK packages
        if: steps.gate.outputs.should_release == 'true'
        env:
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          # Ubuntu runners set ANDROID_HOME. Set it and ANDROID_SDK_ROOT to the
          # same SDK for later steps, so the build script (which prefers
          # ANDROID_SDK_ROOT) uses the SDK these packages go into.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT do not point to an Android SDK. This workflow needs a runner image with the Android SDK."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

          # cmdline-tools/latest, else the highest versioned cmdline-tools/<n.n>
          # (an image may have only, say, cmdline-tools/16.0).
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=""
            while IFS= read -r dir; do
              dir="${dir%/}"
              if [[ "${dir##*/}" =~ ^[0-9]+(\.[0-9]+)*$ ]] && [ -x "$dir/bin/sdkmanager" ]; then
                sdkmanager="$dir/bin/sdkmanager"
              fi
            done < <(ls -d "$sdk"/cmdline-tools/*/ 2>/dev/null | sort -V)
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::No sdkmanager in $sdk/cmdline-tools/latest or a versioned cmdline-tools folder."
            exit 1
          fi
          echo "Using $sdkmanager"

          read -r -d '' -a packages <<<"$SDK_PACKAGES" || true
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::sdk_packages is empty."
            exit 1
          fi

          # yes dies of SIGPIPE when sdkmanager stops reading; that is not a failure.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "${packages[@]}"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.should_release == 'true'

      - name: Pre-build
        if: steps.gate.outputs.should_release == 'true' && (inputs.pre_build_script != '' || inputs.pre_build_command != '')
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PRE_BUILD_SCRIPT: ${{ inputs.pre_build_script }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
          BUILD_ENV: ${{ inputs.build_env }}
          BUILD_ENV_SECRETS: ${{ secrets.BUILD_ENV_SECRETS }}
        run: |
          # Lines were checked in "Check inputs".
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            if [ -z "${line//[[:space:]]/}" ] || [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            export "${line%%=*}=${line#*=}"
          done <<<"$BUILD_ENV"$'\n'"$BUILD_ENV_SECRETS"
          unset BUILD_ENV BUILD_ENV_SECRETS line

          if [ -n "$PRE_BUILD_SCRIPT" ]; then
            echo "Running $PRE_BUILD_SCRIPT"
            bash "$PRE_BUILD_SCRIPT"
          fi
          if [ -n "$PRE_BUILD_COMMAND" ]; then
            echo "Running pre_build_command"
            bash -eo pipefail -c "$PRE_BUILD_COMMAND"
          fi

      # The vmem script installs the mobile workspace deps, runs expo
      # prebuild, builds with Gradle and writes release.json.
      - name: Build signed APK
        if: steps.gate.outputs.should_release == 'true'
        id: build
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          BUILD_ENV: ${{ inputs.build_env }}
          BUILD_ENV_SECRETS: ${{ secrets.BUILD_ENV_SECRETS }}
        run: |
          # Lines were checked in "Check inputs".
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            if [ -z "${line//[[:space:]]/}" ] || [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            export "${line%%=*}=${line#*=}"
          done <<<"$BUILD_ENV"$'\n'"$BUILD_ENV_SECRETS"
          unset BUILD_ENV BUILD_ENV_SECRETS line

          bash "$BUILD_SCRIPT"

      # The publish step trusts these values, and V Store's catalog sync
      # trusts the tag, asset names and release.json. Check them against the
      # chosen version and the APK on disk.
      - name: Check build outputs
        if: steps.gate.outputs.should_release == 'true'
        id: check
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK: ${{ steps.build.outputs.apk }}
          RELEASE_JSON: ${{ steps.build.outputs.release_json }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          APK_BASENAME: ${{ inputs.apk_basename }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          failed=""
          fail() {
            echo "::error::$1"
            failed=1
          }

          for name in APK RELEASE_JSON VERSION_NAME VERSION_CODE SHA256; do
            [ -n "${!name}" ] || fail "The build script wrote no ${name,,} to \$GITHUB_OUTPUT."
          done
          [ -z "$failed" ] || exit 1

          expected_apk="${APK_BASENAME:-$APP_NAME}-$EXPECTED_VERSION_NAME-android.apk"
          [ -f "$APK" ] || fail "APK $APK does not exist."
          [ -f "$RELEASE_JSON" ] || fail "release.json $RELEASE_JSON does not exist."
          [ "$(basename -- "$APK")" = "$expected_apk" ] || fail "APK is named $(basename -- "$APK"); expected $expected_apk."
          [ "$(basename -- "$RELEASE_JSON")" = release.json ] || fail "release_json is named $(basename -- "$RELEASE_JSON"); expected release.json."
          [ "$VERSION_NAME" = "$EXPECTED_VERSION_NAME" ] || fail "Build reports versionName $VERSION_NAME; expected $EXPECTED_VERSION_NAME."
          [ "$VERSION_CODE" = "$EXPECTED_VERSION_CODE" ] || fail "Build reports versionCode $VERSION_CODE; expected $EXPECTED_VERSION_CODE."
          [ -z "$failed" ] || exit 1

          actual_sha256="$(sha256sum -- "$APK" | cut -d ' ' -f 1)"
          [ "$SHA256" = "$actual_sha256" ] || fail "Build reports SHA-256 $SHA256; the APK has $actual_sha256."

          # release.json shape: {"versionName","versionCode","sha256"}, with
          # versionCode a number. Extra keys only warn: V Store reads these 3.
          if ! jq -e --arg n "$EXPECTED_VERSION_NAME" --argjson c "$EXPECTED_VERSION_CODE" --arg s "$actual_sha256" \
            '.versionName == $n and .versionCode == $c and .sha256 == $s' \
            "$RELEASE_JSON" >/dev/null; then
            fail "release.json is not {\"versionName\": \"$EXPECTED_VERSION_NAME\", \"versionCode\": $EXPECTED_VERSION_CODE, \"sha256\": \"$actual_sha256\"}."
            cat -- "$RELEASE_JSON" || true
          elif extra="$(jq -r 'keys - ["sha256", "versionCode", "versionName"] | join(", ")' "$RELEASE_JSON")" && [ -n "$extra" ]; then
            echo "::warning::release.json has keys beyond versionName, versionCode and sha256: $extra."
          fi

          if [ -n "$PACKAGE_ID" ]; then
            build_tools=""
            while IFS= read -r dir; do
              [ -x "$dir/aapt2" ] && build_tools="$dir"
            done < <(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V)
            if [ -z "$build_tools" ]; then
              fail "No build-tools with aapt2 in $ANDROID_SDK_ROOT/build-tools to check package_id."
            else
              badging="$("$build_tools/aapt2" dump badging "$APK")"
              field() { sed -n "s/^package:.* $1='\([^']*\)'.*/\1/p" <<<"$badging"; }
              built="$(field name) $(field versionCode) $(field versionName)"
              expected="$PACKAGE_ID $EXPECTED_VERSION_CODE $EXPECTED_VERSION_NAME"
              [ "$built" = "$expected" ] || fail "APK is $built (package, versionCode, versionName); expected $expected."
            fi
          fi
          [ -z "$failed" ] || exit 1

          echo "Checked $expected_apk: versionName $VERSION_NAME, versionCode $VERSION_CODE, SHA-256 $actual_sha256"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "sha256=$actual_sha256"
          } >> "$GITHUB_OUTPUT"

      # Lets a dry_run's APK be installed and checked without a release.
      - name: Upload dry-run artifact
        if: steps.gate.outputs.should_release == 'true' && (inputs.dry_run && inputs.upload_dry_run_artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-android-dry-run
          path: |
            ${{ steps.build.outputs.apk }}
            ${{ steps.build.outputs.release_json }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.gate.outputs.should_release == 'true'
        id: publish
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.build.outputs.apk }}
          RELEASE_JSON: ${{ steps.build.outputs.release_json }}
          VERSION_NAME: ${{ steps.check.outputs.version_name }}
          VERSION_CODE: ${{ steps.check.outputs.version_code }}
          SHA256: ${{ steps.check.outputs.sha256 }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
          MARK_AS_LATEST: ${{ inputs.mark_as_latest }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -n "$RELEASE_NOTES_PATH" ]; then
            sed -e "s/{{versionName}}/$VERSION_NAME/g" \
              -e "s/{{versionCode}}/$VERSION_CODE/g" \
              -e "s/{{sha256}}/$SHA256/g" \
              "$RELEASE_NOTES_PATH" > "$notes"
          else
            : > "$notes"
          fi

          # Merged PR titles since the previous release of this app. They are
          # appended after sed, so no title can change the template. A
          # failure only drops this section; the release still publishes.
          notes_args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS_TAG" ]; then
            notes_args+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          if changes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" \
            --jq '.body | sub("^## What.s Changed[[:space:]]*"; "")')" && [ -n "$changes" ]; then
            printf "\n## What's changed\n\n%s\n" "$changes" >> "$notes"
          else
            echo "::warning::Could not generate the What's changed notes. Publishing with the template only."
          fi
          cat "$notes"

          if [ "$DRY_RUN" = true ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "dry_run: skipped publish. No tag or release $TAG (versionCode $VERSION_CODE) was created."
            exit 0
          fi

          # gh uploads the assets to a draft, then publishes it, so nobody
          # sees a release without its APK. mark_as_latest defaults to false:
          # other products' releases in the same repo keep the "latest" flag.
          # A tag push releases the pushed tag, so gh must not move it.
          latest=false
          [ "$MARK_AS_LATEST" = true ] && latest=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "$APK" "$RELEASE_JSON" "${target[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${RELEASE_TITLE:-$APP_NAME} $VERSION_NAME" \
            --latest="$latest" \
            --notes-file "$notes"
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          {
            echo "published=true"
            echo "release_url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Published $url"

      - name: Post-publish
        if: steps.gate.outputs.should_release == 'true' && (steps.publish.outputs.published == 'true' && (inputs.post_publish_script != '' || inputs.post_publish_command != ''))
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          APK: ${{ steps.build.outputs.apk }}
          RELEASE_JSON: ${{ steps.build.outputs.release_json }}
          VERSION_NAME: ${{ steps.check.outputs.version_name }}
          VERSION_CODE: ${{ steps.check.outputs.version_code }}
          SHA256: ${{ steps.check.outputs.sha256 }}
          POST_PUBLISH_SCRIPT: ${{ inputs.post_publish_script }}
          POST_PUBLISH_COMMAND: ${{ inputs.post_publish_command }}
          BUILD_ENV: ${{ inputs.build_env }}
          BUILD_ENV_SECRETS: ${{ secrets.BUILD_ENV_SECRETS }}
        run: |
          # Lines were checked in "Check inputs".
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            if [ -z "${line//[[:space:]]/}" ] || [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            export "${line%%=*}=${line#*=}"
          done <<<"$BUILD_ENV"$'\n'"$BUILD_ENV_SECRETS"
          unset BUILD_ENV BUILD_ENV_SECRETS line

          # The keystore is not needed after the build.
          unset ANDROID_KEYSTORE_PATH

          if [ -n "$POST_PUBLISH_SCRIPT" ]; then
            echo "Running $POST_PUBLISH_SCRIPT"
            bash "$POST_PUBLISH_SCRIPT"
          fi
          if [ -n "$POST_PUBLISH_COMMAND" ]; then
            echo "Running post_publish_command"
            bash -eo pipefail -c "$POST_PUBLISH_COMMAND"
          fi

      - name: Remove keystore
        if: always() && steps.gate.outputs.should_release == 'true'
        run: |
          # Only a plain file name, as "Check inputs" requires, so this never
          # removes anything outside RUNNER_TEMP.
          if [[ "$KEYSTORE_FILENAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            rm -f "$RUNNER_TEMP/$KEYSTORE_FILENAME"
          fi
